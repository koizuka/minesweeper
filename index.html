<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper Spoiled+</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener("error", (event) => {
        const target = document.querySelector("#app");
        if (target && !target.children.length) target.textContent = `Startup error: ${event.message}`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        const target = document.querySelector("#app");
        if (target && !target.children.length) target.textContent = `Startup error: ${event.reason}`;
      });
    </script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
